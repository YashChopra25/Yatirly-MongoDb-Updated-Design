<!DOCTYPE html>
<html lang="en" class="dark" data-theme="lime">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>Yatirly — URL Shortener, QR Code Generator & Link Analytics</title>
    <meta
      name="description"
      content="Yatirly turns long URLs into short, shareable links, designs branded QR codes with your logo, and tracks every click by browser, device and OS."
    />
    <meta
      name="keywords"
      content="url shortener, link shortener, short links, qr code generator, custom qr code, qr code with logo, link analytics, click tracking, yatirly"
    />
    <meta name="author" content="Yash Chopra" />
    <meta name="creator" content="Yash Chopra" />
    <meta name="application-name" content="Yatirly" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="%VITE_FRONTEND_URL%/" />

    <!-- Theme & icons -->
    <meta name="theme-color" content="#08090a" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yatirly" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yatirly" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%VITE_FRONTEND_URL%/" />
    <meta property="og:title" content="Yatirly — Shorten it. Scan it. Track every click." />
    <meta
      property="og:description"
      content="Short links, branded QR codes and live click analytics — all from one board."
    />
    <meta property="og:image" content="%VITE_FRONTEND_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yatirly — Shorten it. Scan it. Track every click." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yatirly — Shorten it. Scan it. Track every click." />
    <meta
      name="twitter:description"
      content="Short links, branded QR codes and live click analytics — all from one board."
    />
    <meta name="twitter:image" content="%VITE_FRONTEND_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Yatirly — Shorten it. Scan it. Track every click." />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Yatirly",
        "url": "%VITE_FRONTEND_URL%/",
        "image": "%VITE_FRONTEND_URL%/og-image.png",
        "logo": "%VITE_FRONTEND_URL%/icons/icon-512.png",
        "description": "URL shortener, QR code generator and link analytics in one place.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "author": { "@type": "Person", "name": "Yash Chopra", "url": "https://yashchopra.tech/" }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem("theme");
        var s = localStorage.getItem("colorScheme");
        var r = document.documentElement;
        if (t === "light") { r.classList.remove("dark"); r.classList.add("light"); }
        if (s && ["lime", "violet", "cyan", "rose", "amber"].indexOf(s) !== -1) r.setAttribute("data-theme", s);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Yatirly needs JavaScript enabled to shorten links and generate QR codes.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
